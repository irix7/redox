[package]
description = "The Redox microkernel"

[source]
git = "https://gitlab.redox-os.org/redox-os/kernel.git"
# The Indy port is a patch on a pinned upstream commit (bootstrap.md, Provenance).
rev = "8f0e965e99856fc6215294663fa1a9d1018a7eb2"
patches = ["indy-mips64.patch"]

[build]
template = "custom"
script = """
cd "${COOKBOOK_SOURCE}"
make install BUILD="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}"
"""
