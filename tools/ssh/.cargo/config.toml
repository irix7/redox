# The Indy build passes --target (mk/indy.mk). No [build] target here, so the
# host test build keeps its own triple.

[unstable]
json-target-spec = true
build-std = ["std", "panic_abort"]
build-std-features = ["compiler-builtins-mem"]

[target.mips64-sgi-redox]
rustflags = [
  "-C", "link-arg=-e", "-C", "link-arg=_start",
  "-C", "link-arg=../../build/indy/sysroot/lib/crt0.o",
  "-C", "link-arg=../../build/indy/sysroot/lib/crti.o",
  "-C", "link-arg=-L../../build/indy/sysroot/lib",
  "-C", "link-arg=--gc-sections",
  "-C", "link-arg=-z", "-C", "link-arg=max-page-size=4096",
]
