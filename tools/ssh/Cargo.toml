[package]
name = "ssh"
version = "0.1.0"
edition = "2021"
description = "SSH-2.0 client: curve25519-sha256, ssh-ed25519, chacha20-poly1305@openssh.com"
license = "MIT"

[dependencies]
# Pure-Rust primitives only. No C or assembly backend.
chacha20 = "0.9"
poly1305 = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"

[workspace]

# The crates with the mips64 architecture files (vendor/, tools/vendor.sh).
[patch.crates-io]
redox_syscall = { path = "../../vendor/redox_syscall-0.9.6" }
libc = { path = "../../vendor/libc-0.2.191" }

[profile.release]
opt-level = 3
panic = "abort"
lto = true
codegen-units = 1
debug = false
strip = "symbols"
